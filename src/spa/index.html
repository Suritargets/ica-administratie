<!doctype html>
<html lang="nl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102454"><meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="__APP_SHORT__">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-512.png">
<title>__APP_NAME__</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1c36; --navy-2:#16284a; --yellow:#f6b90b; --yellow-soft:#fff6d9;
  --bg:#f3f5f9; --card:#fff; --line:#e3e7ef; --text:#1a2233; --muted:#6b7487;
  --green:#1f9d63; --red:#d64545; --blue:#2f6fde; --radius:12px;
}
*{box-sizing:border-box}
html,body{overflow-x:clip;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-word{font-weight:800;font-size:22px;letter-spacing:-.5px;line-height:1}
.brand-word i{color:var(--yellow);font-style:normal}
.brand-sub{font-size:9px;letter-spacing:3px;color:var(--yellow);font-weight:700;margin-top:3px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#c9d2e3;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--navy-2);color:#fff}
.nav.on{background:var(--yellow);color:var(--on-accent,var(--navy));font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:11px;color:#8b96ad;padding:8px;line-height:1.6}
.credit a{color:var(--accent-dark,var(--yellow));text-decoration:none;font-weight:600}.credit a:hover{text-decoration:underline}
.mfoot{display:none}
/* main */
.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.3px}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi.hl .l{color:#aab5cc}.kpi.hl .v{color:var(--accent-dark,var(--yellow))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.btn{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c5ccda}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.yel{background:var(--yellow);border-color:var(--yellow);color:var(--on-accent,var(--navy));font-weight:600}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.list{width:100%;border-collapse:collapse}
.list th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.list td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr.click{cursor:pointer}.list tr.click:hover td{background:#f8f9fc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1f6;color:#4a5468}
.tag.Verzonden,.tag.Open{background:#e6efff;color:var(--blue)}
.tag.Geaccepteerd,.tag.Betaald{background:#e3f6ec;color:var(--green)}
.tag.Afgewezen,.tag.Vervallen,.tag.Verlopen{background:#fde8e8;color:var(--red)}
.tag.Concept{background:#f1f2f5;color:#666}
.empty{padding:40px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0}
.filters input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#4a5468}
label.f input,label.f select,label.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:400;font-size:14px;color:var(--text);width:100%}
label.f textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);outline-offset:0;border-color:var(--yellow)}
.sect{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
/* editor */
.editor{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:20px;align-items:start}
.editor>*{min-width:0}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 64px 96px 30px;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.item input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff}
.item .d{grid-column:1/2;display:flex;flex-direction:column;gap:6px}
.item .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.item .x:hover{color:var(--red)}
.mcur{display:block;white-space:nowrap}.fxline{font-size:12px;font-weight:500;opacity:.7;margin-top:4px}
.ratebox{display:flex;gap:10px;flex-wrap:wrap}.ratebox .card{padding:12px 14px;min-width:150px}
.kpi .v .mcur+.mcur{font-size:.62em;opacity:.85;margin-top:2px}
.ac-wrap{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(14,28,54,.16);margin-top:3px;max-height:260px;overflow:auto}
.ac div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.ac div.on,.ac div:hover{background:var(--yellow-soft,#fff6d6)}
.ac small{color:var(--muted)}
.kind{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#eef2f8;color:var(--navy)}
.kind.product{background:#e8f6ee;color:#1d7a46}
.pick{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:hover{background:#f7f9fc}.pick .grow{flex:1;min-width:0}
.cur-badge{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:#eef2f8;color:var(--navy);margin-left:6px}
.totline{display:flex;justify-content:space-between;padding:4px 2px;font-variant-numeric:tabular-nums}
.totline.big{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.preview-wrap{position:sticky;top:20px;background:#dfe3ea;border-radius:var(--radius);padding:18px;overflow:hidden}
.preview-scale{transform-origin:top left}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,28,54,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:620px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500}
.toast.err{background:var(--red)}

/* ============ A4 document ============ */
.sheet{width:210mm;min-height:297mm;background:#fff;color:#14203a;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);font-size:10pt;line-height:1.4;font-family:Inter,system-ui,sans-serif}
.sh-head{background:var(--navy);color:#fff;padding:10mm 12mm 22mm;display:flex;justify-content:space-between;gap:10mm;position:relative}
.sh-head .co{font-size:8.5pt;line-height:1.75}
.sh-head .co b{font-size:10.5pt;display:block;margin-bottom:2mm}
.sh-head .co div{display:flex;gap:3mm;align-items:center}
.sh-head .co svg{width:3.4mm;height:3.4mm;flex:none}
.sh-wave{position:absolute;left:0;right:0;bottom:-1px;height:20mm;display:block}
.logo{display:flex;align-items:center;gap:3mm}
.logo svg{width:17mm;height:15mm}
.logo .w{font-weight:800;font-size:27pt;letter-spacing:-1px;line-height:.9}
.logo .w i{color:var(--yellow);font-style:normal}
.logo .s{font-size:7pt;letter-spacing:2.6mm;color:var(--yellow);font-weight:700;margin-top:1.5mm}
.logo img{height:19mm;max-width:75mm;object-fit:contain;object-position:left center;display:block}
.sh-body{padding:4mm 12mm 0;flex:1;display:flex;flex-direction:column;position:relative;z-index:1}
.sh-title{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm}
.sh-title .t{display:flex;gap:4mm;align-items:flex-start}
.sh-title .t svg{width:11mm;height:12mm;flex:none;margin-top:1mm}
.sh-title h3{font-size:22pt;margin:0;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
.sh-title .tl{font-size:9pt;color:#3c4760}
.metabox{border:1px solid #dfe3ea;border-radius:2.5mm;overflow:hidden;min-width:62mm;font-size:9pt}
.metabox div{display:flex;justify-content:space-between;gap:6mm;padding:1.6mm 3.5mm}
.metabox .h{background:#f4f6fa;font-weight:700;border-bottom:1px solid #dfe3ea}
.metabox.inv .h{background:var(--yellow);border-color:var(--yellow)}
.addr{display:grid;grid-template-columns:1fr 1fr;margin:7mm 0 6mm;font-size:9.5pt}
.addr > div:first-child{padding-right:8mm;border-right:1px solid #dfe3ea}
.addr > div:last-child{padding-left:8mm}
.addr b.l{display:block;font-size:10pt}
.addr .cn{font-weight:700;font-size:11pt}
.dt{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #dfe3ea;border-radius:2.5mm;overflow:hidden;font-size:9pt}
.dt th{background:var(--navy);color:#fff;text-align:left;padding:2.6mm 3mm;font-weight:700}
.dt td{padding:3mm;border-top:1px solid #e7eaf0;vertical-align:top}
.dt tr:first-child td{border-top:0}
.dt .r{text-align:right;white-space:nowrap}
.dt .c{text-align:center}
.dt small{display:block;color:#4b5670;font-size:8.3pt}
.lower{display:grid;grid-template-columns:1fr 78mm;gap:6mm;margin-top:6mm;align-items:start}
.infobox{background:#f4f6fa;border-radius:2.5mm;padding:4mm 5mm;font-size:8.6pt}
.infobox h4{margin:0 0 2mm;font-size:10.5pt;display:flex;gap:2mm;align-items:center}
.infobox h4 svg{width:5mm;height:5mm}
.infobox ul{margin:0;padding-left:4mm}
.infobox li::marker{color:var(--yellow)}
.infobox p{margin:.6mm 0}
.tots{border:1px solid #dfe3ea;border-radius:2.5mm;overflow:hidden;font-size:9.5pt}
.tots div{display:flex;justify-content:space-between;padding:2.6mm 4mm;border-top:1px solid #e7eaf0}
.tots div:first-child{border-top:0}
.tots .g{background:var(--yellow);font-weight:800;font-size:11.5pt;border-top:0}
.closing{font-size:9pt;white-space:pre-line}
.rw{margin-top:6mm;position:relative}.rw:first-child{margin-top:0}
.rw.push{margin-top:auto;padding-top:10mm}
.sh-body{padding-bottom:8mm}
.rw.two{display:grid;grid-template-columns:1fr 1fr;gap:8mm;align-items:start}.rw.two.tr{grid-template-columns:1fr 78mm}.rw.two.tl{grid-template-columns:78mm 1fr}
.blk{position:relative;min-width:0}
.party{font-size:9.5pt;line-height:1.45}.party b.l{display:block;font-size:10pt}.party .cn{font-weight:700;font-size:11pt}.party .sm{font-size:8pt;color:#4b5670;margin-top:1mm}
.party .ico{display:flex;flex-direction:column;gap:.5mm;margin-top:1mm;font-size:8.8pt}.party .ico span{display:flex;align-items:center;gap:2mm}.party .ico svg{width:3.2mm;height:3.2mm;flex:none}
.party .ico svg *{stroke:#0e1c36}.party .ico svg path[fill="#fff"]{fill:#0e1c36}
.rw.two>.blk+.blk>.party{border-left:1px solid #dfe3ea;padding-left:8mm}
.sh-head{min-height:30mm}
/* ===== documentstijl: modern (o.a. ICA) ===== */
.sheet.modern{--dp:var(--navy);--dl:var(--label,#2d5d9f);--box:#eef3f8;color:#1b2333;font-size:9.5pt}
.sheet.modern .m-top{height:4mm;background:var(--dp)}
.sheet.modern .m-head{display:flex;justify-content:space-between;align-items:flex-start;padding:6mm 13mm 0 13mm;gap:8mm}
.sheet.modern .m-logo img{height:30mm;max-width:85mm;object-fit:contain;object-position:left top;display:block}
.sheet.modern .m-ttl{text-align:right;padding-top:5mm}
.sheet.modern .m-ttl h1{margin:0;font-size:26pt;font-weight:800;letter-spacing:.5px;color:var(--dp);line-height:1}
.sheet.modern .m-no{color:var(--dl);font-weight:700;font-size:10pt;margin-top:2.5mm}
.sheet.modern .m-tag{color:#6b7487;font-size:8.5pt;margin-top:1.5mm}
.sheet.modern .m-rule{height:1px;background:#dfe4ec;margin:6mm 13mm 0}
.sheet.modern .sh-body{padding:8mm 13mm 0}
.sheet.modern .rw{margin-top:8mm}.sheet.modern .rw:first-child{margin-top:0}
.sheet.modern .rw.two{gap:6mm;align-items:stretch}.sheet.modern .rw.two>.blk>*{height:100%;box-sizing:border-box}
.sheet.modern .rw.two.tr,.sheet.modern .rw.two.tl{grid-template-columns:1fr 1fr}
.sheet.modern .ml{color:var(--dl);font-weight:700;font-size:7.5pt;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2.5mm}
.sheet.modern .m-box{background:var(--box);border-radius:2.5mm;padding:4.5mm 5mm;min-height:22mm}
.sheet.modern .m-name{font-weight:700;font-size:10pt;color:#141c2c;margin-bottom:1.5mm}
.sheet.modern .m-sub{color:#5b6475;font-size:8.6pt;line-height:1.6}
.sheet.modern .m-pay{font-size:9pt;line-height:1.9;color:#1b2333}
.sheet.modern .m-dates{display:flex;gap:22mm}.sheet.modern .m-dates b{font-size:10pt;color:#141c2c}
.sheet.modern .ml+b{display:block}
.sheet.modern .m-table{width:100%;border-collapse:separate;border-spacing:0;font-size:9pt}
.sheet.modern .m-table th{background:var(--dp);color:#fff;text-align:left;padding:2.8mm 4mm;font-size:7.8pt;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.sheet.modern .m-table th:first-child{border-radius:2mm 0 0 2mm}.sheet.modern .m-table th:last-child{border-radius:0 2mm 2mm 0}
.sheet.modern .m-table td{padding:4.5mm 4mm;vertical-align:top;border-bottom:1px solid #e3e7ee;line-height:1.55}
.sheet.modern .m-table td small{display:block;color:#6b7487;font-size:8pt}
.sheet.modern .m-table .r{text-align:right;white-space:nowrap}.sheet.modern .m-table .c{text-align:center}
.sheet.modern .m-tots{margin-left:auto;width:82mm;font-size:9pt}
.sheet.modern .rw.two .m-tots{width:auto}
.sheet.modern .m-tots>div{display:flex;justify-content:space-between;padding:1.8mm 3mm}.sheet.modern .m-tots>div span:first-child{color:#6b7487}
.sheet.modern .m-tots .g{border-top:1px solid #d5dbe5;margin-top:2mm;padding-top:4mm;align-items:baseline}
.sheet.modern .m-tots .g span:first-child{color:var(--dp);font-weight:800;font-size:10pt;letter-spacing:.4px}
.sheet.modern .m-tots .g span:last-child{color:var(--dp);font-weight:800;font-size:15pt}
.sheet.modern .m-closing{white-space:pre-line;color:#5b6b85;font-size:9.5pt;line-height:1.7;border-top:1px solid #e3e7ee;padding-top:5mm}
.sheet.modern .m-sign b{display:block;font-size:10pt}.sheet.modern .m-sign span{color:#6b7487;font-size:8.6pt}
.sheet.modern .m-foot{display:flex;justify-content:space-between;align-items:flex-end;padding:6mm 13mm 8mm;font-size:7.5pt;color:#6b7487;margin-top:6mm}
.sheet.modern .m-foot>div{display:flex;flex-direction:column;gap:2.5mm;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.sheet.modern .m-foot i{display:block;width:10mm;height:.8mm;background:var(--dl)}
.sheet.modern .rw.push{padding-top:6mm}
/* sjablooneditor */
.sheet.editing .blk{outline:1px dashed transparent;outline-offset:1.5mm;border-radius:1mm;transition:outline-color .12s}
.sheet.editing .blk:hover{outline-color:#9aa7c0}
.sheet.editing .blk.dragging{opacity:.35}
.blk-h{position:absolute;top:-4.6mm;left:-1mm;z-index:5;font:600 7.5pt Inter,sans-serif;background:var(--navy);color:#fff;padding:.6mm 2mm;border-radius:1.2mm;cursor:grab;opacity:0;transition:opacity .12s;touch-action:none;user-select:none;white-space:nowrap}
.sheet.editing .blk:hover>.blk-h,.sheet.editing .blk.dragging>.blk-h{opacity:1}
.sheet.editing [data-l],.sheet.editing [data-s]{cursor:text;border-radius:.8mm;outline:1px dotted transparent}
.sheet.editing [data-l]:hover,.sheet.editing [data-s]:hover{outline-color:var(--yellow);background:rgba(246,185,11,.12)}
.sheet.editing [data-l]:focus,.sheet.editing [data-s]:focus{outline:1.5px solid var(--yellow);background:#fff}
.drop-ind{position:absolute;z-index:6;background:var(--yellow);border-radius:2px;pointer-events:none;box-shadow:0 0 0 2px rgba(246,185,11,.3)}
.lay-list{display:flex;flex-direction:column;gap:6px}
.lay-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.lay-item.off{opacity:.55;background:#f6f7fa}
.lay-item button{border:0;background:none;cursor:pointer;font-size:12px;color:var(--navy);text-decoration:underline}
.sign{display:flex;gap:8mm;margin-top:8mm;align-items:flex-end;font-size:9pt}
.sign .who{border-top:.6mm solid var(--yellow);padding-top:2mm;min-width:45mm}
.sign .who b{display:block;font-size:10.5pt}
.sign .ct{border-left:1px solid #dfe3ea;padding-left:8mm;line-height:1.8}
.wm{position:absolute;right:12mm;bottom:20mm;width:40mm;height:auto;opacity:.08;z-index:0;pointer-events:none}
.wm.wm-custom{width:60mm;filter:grayscale(1) brightness(.3);opacity:.06}
.sh-foot .fmark{height:5.5mm;width:auto;display:block}
.sh-foot{background:var(--navy);color:#fff;font-size:8pt;padding:4mm 12mm;display:flex;gap:5mm;align-items:center;margin-top:8mm;position:relative}
.sh-foot b{font-size:9pt}
.sh-foot .sep{opacity:.5}
.sh-foot::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22mm;background:var(--yellow);clip-path:polygon(100% 0,100% 100%,0 100%)}

@media (max-width:1100px){.editor{grid-template-columns:1fr}.preview-wrap{position:static}}
.mtop,.m-only,.m-inline{display:none}
.help{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.help-toc{position:sticky;top:18px;display:flex;flex-direction:column;gap:2px;padding:12px;max-height:calc(100vh - 40px);overflow:auto}
.help-toc input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.help-toc a{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:inherit;text-decoration:none}.help-toc a:hover{background:#f1f4f9}.help-toc a.dim{opacity:.35}
.help-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.help-body section{scroll-margin-top:70px;line-height:1.6;font-size:14px}.help-body h2{margin-top:0}
.help-body ul{padding-left:20px;margin:6px 0}.help-body li{margin:3px 0}.help-body p{margin:8px 0}
.help-body a[data-go],.help-body a[data-h]{color:var(--accent-dark,#1f4fa0);font-weight:600;cursor:pointer;text-decoration:underline}
.help-body code,.help-body kbd{background:#f1f4f9;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12.5px}
.help-body table{margin:6px 0}.help-body td{padding:6px 8px;vertical-align:top}
.licbar{grid-column:2;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 30px;font-size:14px;position:sticky;top:0;z-index:25}
.licbar.bad{background:#fde8e8;color:#8a1f1f;border-bottom:1px solid #f5c2c2}.licbar.warn{background:var(--yellow-soft);color:#6b4e00;border-bottom:1px solid #f3dc93}
.app{grid-template-rows:auto 1fr}.side{grid-row:1/3}.app>.main{grid-column:2}
.act-bg{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#0e1c36 0%,#16284a 60%,#0e1c36 100%);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.act{width:100%;max-width:440px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.act-head{background:var(--navy);padding:22px 26px;border-bottom:5px solid var(--yellow)}.act-head img{height:44px;display:block}.act-head div{color:#8b96ad;font-size:10px;letter-spacing:3px;font-weight:700;margin-top:6px;text-transform:uppercase}
.act-body{padding:24px 26px}.act-foot{background:#f4f6fa;padding:10px 26px;font-size:12px;color:var(--muted);text-align:center}.act-foot a{color:var(--navy)}
@media (max-width:760px){
  /* app-shell: logobalk boven, tabbalk onder */
  .app{display:block;min-height:100vh}
  .mtop{display:flex;position:sticky;top:0;z-index:30;background:var(--navy);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top))}
  .mtop img{height:30px;width:auto}
  .mtop .v{color:#8b96ad;font-size:11px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:35;flex-direction:row;justify-content:space-between;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;box-shadow:0 -6px 24px rgba(14,28,54,.18)}
  .brand,.side-foot{display:none}
  .nav{flex:1 1 0;flex-direction:column;gap:3px;padding:6px 0;font-size:10.5px;white-space:nowrap;overflow:hidden;border-radius:10px;text-align:center;justify-content:center;width:auto;min-width:0;color:#aab5cc}
  .nav svg{width:22px;height:22px}
  .nav.d-nav{display:none}
  .help{grid-template-columns:1fr}.help-toc{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.help-toc input{width:100%}.help-toc a{background:#f1f4f9;font-size:12px}
  .nav .lbl{font-size:0}.nav .lbl::after{content:attr(data-s);font-size:10px}
  .nav.on{background:transparent;color:var(--accent-dark,var(--yellow));font-weight:600}
  .nav:hover{background:transparent}
  .main{padding:16px 14px 8px}
  .licbar{top:calc(52px + env(safe-area-inset-top));padding:10px 14px;font-size:13px}
  .mfoot{display:block;text-align:center;font-size:12px;color:var(--muted);padding:6px 16px calc(92px + env(safe-area-inset-bottom))}
  .mfoot a{color:var(--navy)}
  h1{font-size:21px}
  .top{margin-bottom:14px}
  .top .row{flex-wrap:wrap}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

  .grid2,.form{grid-template-columns:1fr;gap:12px}

  .btn{padding:10px 14px}
  .m-only{display:block}.btn.m-only{display:inline-flex}.m-inline{display:inline}
  .d-only{display:none!important}
  /* tabellen worden kaarten */
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tfoot{display:block}
  table.cards tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"num tot" "cli st" "meta meta";gap:3px 10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  table.cards td{display:block;border:0;padding:0;min-width:0}
  table.cards .c-num{grid-area:num;font-size:15px}
  table.cards .c-tot{grid-area:tot;text-align:right}
  table.cards .c-cli{grid-area:cli;overflow:hidden;text-overflow:ellipsis}
  table.cards .c-st{grid-area:st;text-align:right}
  table.cards .c-meta{grid-area:meta;color:var(--muted);font-size:12.5px}
  table.cards .m-hide{display:none}
  table.cards tr.click:hover td{background:none}
  table.cards tr.click:active{background:#f4f6fa}
  table.cards tfoot tr{display:flex;justify-content:space-between;border:0;background:none;padding:4px 2px}
  table.cards tfoot td{padding:0!important}
  .filters input{min-width:0;flex:1 1 100%}
  .filters select{flex:1}
  /* editor */
  .ed-top{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:20;background:var(--bg);padding:10px 0 8px;margin:-16px 0 10px;flex-direction:column;align-items:stretch;gap:8px}
  .ed-top h1{font-size:18px}
  .ed-top .acts{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .ed-top .acts::-webkit-scrollbar{display:none}
  .ed-top .acts #save{order:-1}
  .item{grid-template-columns:1fr 1fr 34px;padding:10px}.item .d{grid-column:1/-1}
  .item input{padding:9px 10px}
  .preview-wrap{padding:10px;border-radius:12px}
  .preview-wrap::before{content:"Voorbeeld";display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#4a5468;margin:0 0 8px 2px}
  /* meldingen boven de tabbalk */
  .toast{bottom:calc(86px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px)}
  #updBanner{left:12px!important;right:12px!important;bottom:calc(84px + env(safe-area-inset-bottom))!important}
  /* modals als bottom sheet */
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;height:297mm;overflow:hidden}
  .side,.top,.mtop,#updBanner,.editor>.card,.modal-bg,.toast{display:none!important}
  .preview-wrap::before{display:none!important}
  .app{display:block}.main{padding:0}.editor{display:block}
  .preview-wrap{position:static;padding:0;background:none;border-radius:0}
  body *{visibility:hidden}
  #print-root,#print-root *{visibility:visible}
  #print-root{position:absolute;left:0;top:0}
  #print-root{transform:none!important;width:210mm!important;height:297mm!important}
  .sheet{box-shadow:none;width:210mm;height:297mm;min-height:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
// ================= utils =================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ESC = esc;
// op documenten: alleen <br>, <b>, <i>, <u> (en <strong>/<em>) toegestaan, de rest blijft gewone tekst
const rich = s => esc(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/&lt;(\/?)(b|i|u|strong|em)&gt;/gi, (m, sl, tg) => `<${sl}${tg.toLowerCase()}>`);
const plain = s => String(s ?? '').replace(/<br\s*\/?>/gi, ' ').replace(/<\/?(b|i|u|strong|em)>/gi, '');
const _fmt = {};
// bedragen in de valuta/notatie van de instellingen (EUR → € 1.234,56 · SRD + en-US → SRD 1,234.56)
const CURRENCIES = ['SRD', 'USD', 'EUR', 'ANG', 'GBP'];
const defCur = () => String(((typeof S !== 'undefined' && S.settings) || {}).currency || 'EUR').toUpperCase().trim() || 'EUR';
const curOf = d => (d && d.currency) || defCur();
const eur = n => money(n, defCur());
// meerdere valuta's: per valuta optellen, nooit omrekenen
function sumByCur(arr, key) { const m = {}; for (const d of arr) { const c = curOf(d); m[c] = (m[c] || 0) + (Number(d[key]) || 0); } return m; }
function moneyMulti(map) {
  const e = Object.entries(map).filter(([, v]) => v);
  if (!e.length) return money(0, defCur());
  const ix = c => { const i = CURRENCIES.indexOf(c); return i < 0 ? 99 : i; };
  return e.sort((a, b) => ix(a[0]) - ix(b[0])).map(([c, v]) => `<span class="mcur">${money(v, c)}</span>`).join('');
}
// ---- wisselkoersen: 1 [valuta] = koers × [hoofdvaluta] ----
const baseCur = () => String((S.settings || {}).base_currency || defCur()).toUpperCase();
function rateFor(cur, date) {
  const base = baseCur(); if (!cur || cur === base) return 1;
  const list = (S.rates || []).filter(r => r.currency === cur && r.base === base);
  const before = list.filter(r => r.date <= (date || '9999')).sort((a, b) => b.date.localeCompare(a.date))[0];
  return (before || list.sort((a, b) => a.date.localeCompare(b.date))[0])?.rate ?? null;
}
const fxOf = d => { const c = curOf(d); if (c === baseCur()) return 1; return d.fx_rate && d.fx_base === baseCur() ? d.fx_rate : rateFor(c, d.date); };
// omgerekend totaal in hoofdvaluta; missing = aantal documenten zonder koers
function toBase(arr, key) { let sum = 0, missing = 0; for (const d of arr) { const r = fxOf(d); if (r == null) missing++; else sum += (Number(d[key]) || 0) * r; } return { sum, missing }; }
function baseLine(arr, key) {
  if (new Set(arr.map(curOf)).size < 2) return '';
  const { sum, missing } = toBase(arr, key);
  return `<div class="fxline">≈ ${money(sum, baseCur())}${missing ? ` <span title="${missing} document(en) zonder koers">· ${missing} zonder koers</span>` : ''}</div>`;
}
const fmtRate = r => new Intl.NumberFormat((S.settings || {}).number_locale || 'nl-NL', { maximumFractionDigits: 6 }).format(r);
const money = (n, curIn) => {
  const st = (typeof S !== 'undefined' && S.settings) || {};
  const cur = String(curIn || st.currency || 'EUR').toUpperCase().trim() || 'EUR', loc = st.number_locale || 'nl-NL', k = cur + '|' + loc;
  if (!_fmt[k]) { try { _fmt[k] = new Intl.NumberFormat(loc, { style: 'currency', currency: cur, currencyDisplay: ['EUR', 'USD', 'GBP'].includes(cur) ? 'symbol' : 'code' }); } catch { const nf = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); _fmt[k] = { format: v => `${cur} ${nf.format(v)}` }; } }
  return _fmt[k].format(Number(n) || 0).replace(/\u00a0/g, ' ');
};
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, d) => { const x = new Date(iso + 'T12:00:00'); x.setDate(x.getDate() + Number(d || 0)); return x.toISOString().slice(0, 10); };
const fdate = (iso, st) => {
  if (!iso) return '—';
  const style = st || (typeof S !== 'undefined' && S.settings?.date_style) || 'nl', d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
  if (style === 'iso') return String(iso).slice(0, 10);
  if (style === 'en') return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
function calc(items, vat, discount = 0) {
  const subtotal = round2(items.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.rate) || 0), 0));
  const disc = round2(Math.min(Math.max(Number(discount) || 0, 0), subtotal));
  const vat_amount = round2((subtotal - disc) * (Number(vat) || 0) / 100);
  return { subtotal, discount: disc, vat_amount, total: round2(subtotal - disc + vat_amount) };

const vatDefault = s => s.vat_rate === '' || s.vat_rate == null || isNaN(Number(s.vat_rate)) ? 21 : Number(s.vat_rate);

  if (c.id) $('#del', bg).onclick = async () => { if (!confirm(`“${c.name}” uit de catalogus verwijderen? Bestaande documenten blijven ongewijzigd.`)) return; await api('catalog/' + c.id, { method: 'DELETE' }); S.catalog = await api('catalog'); close(); render(); };
  $('[name=name]', bg).focus();
}
function catalogPicker(docCur, onPick) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const sel = new Map(); let q = '';
  bg.innerHTML = `<div class="modal"><h2>Uit catalogus kiezen</h2>
    <input id="pq" placeholder="Zoeken…" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px">
    <div id="pl" style="max-height:52vh;overflow:auto"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn sm" id="pnew">+ Nieuw item</button>
      <div class="row"><button class="btn" id="cancel">Annuleren</button><button class="btn pri" id="ok">Toevoegen</button></div></div></div>`;
  document.body.appendChild(bg);
  const draw = () => {
    const list = S.catalog.filter(c => c.active && (!q || [c.name, c.description, c.category, c.sku].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => (curOf(b) === docCur) - (curOf(a) === docCur) || b.used - a.used || a.name.localeCompare(b.name));
    $('#pl', bg).innerHTML = list.map(c => `<div class="pick" data-id="${c.id}"><input type="checkbox" ${sel.has(c.id) ? 'checked' : ''} style="width:auto">
      <div class="grow"><b>${esc(plain(c.name))}</b>${curOf(c) !== docCur ? `<span class="cur-badge">${curOf(c)}</span>` : ''}<div class="muted" style="font-size:12px">${esc([c.category, c.description].filter(Boolean).join(' · '))}</div></div>
      <input type="number" class="pqty" min="0" step="any" value="${sel.get(c.id) ?? 1}" title="Aantal" style="width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px">
      <b style="white-space:nowrap">${money(c.price, curOf(c))}</b></div>`).join('') || `<p class="muted">${S.catalog.length ? 'Niets gevonden.' : 'De catalogus is nog leeg.'}</p>`;
    $('#ok', bg).textContent = sel.size ? `Toevoegen (${sel.size})` : 'Toevoegen';
  };
  draw();
  $('#pq', bg).oninput = e => { q = e.target.value.toLowerCase(); draw(); };
  $('#pl', bg).onclick = e => { const row = e.target.closest('.pick'); if (!row || e.target.classList.contains('pqty')) return; const id = Number(row.dataset.id);
    if (sel.has(id)) sel.delete(id); else sel.set(id, Number(row.querySelector('.pqty').value) || 1); draw(); };
  $('#pl', bg).oninput = e => { if (!e.target.classList.contains('pqty')) return; const id = Number(e.target.closest('.pick').dataset.id); sel.set(id, Number(e.target.value) || 0); $('#ok', bg).textContent = `Toevoegen (${sel.size})`; e.target.closest('.pick').querySelector('[type=checkbox]').checked = true; };
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  $('#cancel', bg).onclick = close;
  $('#pnew', bg).onclick = () => catalogModal({ kind: 'dienst', active: 1, currency: docCur }, saved => { sel.set(saved.id, 1); draw(); });
  $('#ok', bg).onclick = () => { const picked = [...sel].map(([id, qty]) => ({ c: S.catalog.find(c => c.id === id), qty })).filter(p => p.c); close(); if (picked.length) onPick(picked); };
  $('#pq', bg).focus();
}

const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
function renderFx(m) {
  const base = baseCur(), f = S.filter;
  const invs = S.docs.filter(d => d.type === 'factuur' && d.status !== 'Concept');
  const years = [...new Set([String(new Date().getFullYear()), ...S.docs.map(d => (d.date || '').slice(0, 4)).filter(Boolean)])].sort().reverse();
  const yr = f.yr || years[0];
  const inYr = invs.filter(d => (d.date || '').startsWith(yr)), offsYr = S.docs.filter(d => d.type === 'offerte' && (d.date || '').startsWith(yr));
  const used = [...new Set([...S.docs.map(curOf), ...S.rates.map(r => r.currency), 'SRD', 'USD', 'EUR'])];
  const curs = [...new Set([...inYr, ...offsYr].map(curOf))].sort((a, b) => CURRENCIES.indexOf(a) - CURRENCIES.indexOf(b));
  const foreign = used.filter(c => c !== base);
  const latest = c => S.rates.filter(r => r.currency === c && r.base === base).sort((a, b) => b.date.localeCompare(a.date))[0];
  const stat = (arr, c) => { const a = arr.filter(d => curOf(d) === c), s = k => a.reduce((x, d) => x + (Number(d[k]) || 0), 0);
    const paid = a.filter(d => d.status === 'Betaald'); return { n: a.length, tot: s('total'), paid: paid.reduce((x, d) => x + d.total, 0), open: a.filter(d => d.status === 'Open').reduce((x, d) => x + d.total, 0) }; };
  const all = toBase(inYr, 'total'), allPaid = toBase(inYr.filter(d => d.status === 'Betaald'), 'total'), allOpen = toBase(inYr.filter(d => d.status === 'Open'), 'total');
  const missing = invs.filter(d => fxOf(d) == null).length;
  const hist = S.rates.filter(r => r.base === base).sort((a, b) => b.date.localeCompare(a.date) || a.currency.localeCompare(b.currency));
  m.innerHTML = `
  <div class="top"><h1>Valuta & koersen</h1><div class="row"><select id="fy">${years.map(y => `<option ${y === yr ? 'selected' : ''}>${y}</option>`).join('')}</select><button class="btn sm" id="fxcsv">Export CSV</button></div></div>
  <p class="muted" style="margin-top:-6px">Elke valuta wordt apart bijgehouden. Met de koersen hieronder zie je ook het totaal omgerekend naar je hoofdvaluta <b>${base}</b>. Elk document bewaart de koers van zijn datum.</p>
  ${missing ? `<div class="card" style="border-color:#f5d48a;background:#fffaf0;margin-bottom:14px">⚠ ${missing} factu${missing > 1 ? 'ren hebben' : 'ur heeft'} nog geen koers. Voeg hieronder een koers toe voor ${[...new Set(invs.filter(d => fxOf(d) == null).map(curOf))].join(', ')}.</div>` : ''}
  <div class="kpis">
    ${curs.map(c => { const s = stat(inYr, c), o = stat(offsYr, c); return `<div class="card kpi"><div class="l">${c}${c === base ? ' · hoofdvaluta' : ''}</div>
      <div class="v">${money(s.tot, c)}</div><div class="muted">${s.n} facturen ${yr}</div>
      <div style="margin-top:8px;font-size:13px;line-height:1.6"><div>Ontvangen <b style="color:var(--green)">${money(s.paid, c)}</b></div><div>Openstaand <b>${money(s.open, c)}</b></div><div class="muted">Offertes ${money(o.tot, c)}</div></div></div>`; }).join('')
      || `<div class="card kpi"><div class="l">${yr}</div><div class="v">${money(0, base)}</div><div class="muted">Nog geen facturen</div></div>`}
    ${curs.length > 1 || (curs[0] && curs[0] !== base) ? `<div class="card kpi hl"><div class="l">Totaal omgerekend</div><div class="v">≈ ${money(all.sum, base)}</div>
      <div style="margin-top:8px;font-size:13px;line-height:1.6;color:#d5dcea"><div>Ontvangen ≈ ${money(allPaid.sum, base)}</div><div>Openstaand ≈ ${money(allOpen.sum, base)}</div>${all.missing ? `<div>${all.missing} zonder koers niet meegeteld</div>` : ''}</div></div>` : ''}
  </div>
  <div class="card" style="margin-bottom:18px"><h2>Per maand ${yr} (gefactureerd incl. BTW)</h2>
    <div class="tablewrap"><table class="list"><thead><tr><th>Maand</th>${curs.map(c => `<th class="num">${c}</th>`).join('')}${curs.length ? `<th class="num">≈ ${base}</th>` : ''}</tr></thead><tbody>
    ${MONTHS.map((mn, i) => { const mm = `${yr}-${String(i + 1).padStart(2, '0')}`, a = inYr.filter(d => d.date.startsWith(mm)); if (!a.length) return '';
      return `<tr><td>${mn}</td>${curs.map(c => { const v = a.filter(d => curOf(d) === c).reduce((x, d) => x + d.total, 0); return `<td class="num">${v ? money(v, c) : '<span class="muted">—</span>'}</td>`; }).join('')}<td class="num"><b>${money(toBase(a, 'total').sum, base)}</b></td></tr>`; }).join('')
      || `<tr><td class="empty" colspan="${curs.length + 2}">Geen facturen in ${yr}</td></tr>`}
    </tbody></table></div></div>
  <div class="grid2">
    <div class="card"><h2>Koers toevoegen</h2>
      <div class="ratebox" style="margin-bottom:12px">${foreign.map(c => { const r = latest(c); return `<div class="card"><div class="muted" style="font-size:12px">1 ${c} =</div><b>${r ? `${fmtRate(r.rate)} ${base}` : '—'}</b><div class="muted" style="font-size:11px">${r ? fdate(r.date) : 'nog geen koers'}</div></div>`; }).join('')}</div>
      <form class="form" id="rf">
        <label class="f">Datum<input type="date" name="date" value="${today()}"></label>
        <label class="f">Valuta<select name="currency" id="rfcur">${foreign.map(c => `<option>${c}</option>`).join('')}</select></label>
        <label class="f">Koers (1 valuta = … ${base})<input name="rate" type="number" step="any" inputmode="decimal" placeholder="bijv. 36,50" required></label>
        <label class="f" style="justify-content:flex-end"><button class="btn pri" type="submit">Koers opslaan</button></label></form>
      <div class="sect">Hoofdvaluta</div>
      <div class="row"><select id="basesel">${[...new Set([...CURRENCIES, base])].map(c => `<option ${c === base ? 'selected' : ''}>${c}</option>`).join('')}</select><span class="muted" style="font-size:12px">Alles wordt hiernaar omgerekend. Koersen gelden per hoofdvaluta.</span></div></div>
    <div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0">Koershistorie</h2>
      <div class="row">${[...new Set(hist.map(r => r.currency))].map(c => `<button class="btn sm" data-rexp="${c}">Export ${c}</button>`).join('')}</div></div>
      <div class="tablewrap" style="max-height:420px;overflow:auto"><table class="list"><thead><tr><th>Datum</th><th>Valuta</th><th class="num" style="text-align:right">Koers</th><th></th></tr></thead><tbody>
      ${hist.map(r => `<tr><td>${fdate(r.date)}</td><td>1 ${r.currency}</td><td class="num">${fmtRate(r.rate)} ${base}</td><td class="num"><button class="btn sm" data-rdel="${r.id}" title="Verwijderen">×</button></td></tr>`).join('') || '<tr><td class="empty" colspan="4">Nog geen koersen</td></tr>'}
    </tbody></table></div></div>
  </div>`;
  const reload = async () => { S.rates = (await api('rates')).rates; S.docs = await api('docs'); renderFx(m); };
  $('#fy').onchange = e => { S.filter.yr = e.target.value; renderFx(m); };
  $('#rf').onsubmit = async e => { e.preventDefault(); try { await api('rates', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); toast('Koers opgeslagen'); await reload(); } catch (er) { toast(er.message, 1); } };
  m.querySelectorAll('[data-rexp]').forEach(b => b.onclick = () => {
    const c = b.dataset.rexp, rows = hist.filter(r => r.currency === c).sort((a, z) => a.date.localeCompare(z.date));
    const head = ['Datum', 'Valuta', `Koers (1 ${c} = … ${base})`, 'Hoofdvaluta', `Omgekeerd (1 ${base} = … ${c})`];
    const lines = rows.map(r => [r.date, c, String(r.rate).replace('.', ','), base, String(Math.round(1e6 / r.rate) / 1e6).replace('.', ',')]);
    const csv = '\ufeff' + [head, ...lines].map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `koersen-${c}-${base}-${today()}.csv`; a.click();
    track('rates_export');
  });
  m.querySelectorAll('[data-rdel]').forEach(b => b.onclick = async () => { if (!confirm('Deze koers verwijderen?')) return; await api('rates/' + b.dataset.rdel, { method: 'DELETE' }); await reload(); });
  $('#basesel').onchange = async e => { if (!confirm(`Hoofdvaluta wijzigen naar ${e.target.value}? Je hebt dan koersen nodig ten opzichte van ${e.target.value}.`)) { e.target.value = base; return; }
    S.settings = await api('settings', { method: 'POST', body: { base_currency: e.target.value } }); await reload(); };
  $('#fxcsv').onclick = () => {
    const head = ['Factuurnr.', 'Datum', 'Klant', 'Status', 'Valuta', 'Incl. BTW', 'Koers', `Incl. BTW in ${base}`];
    const n = v => v == null ? '' : String(Math.round(v * 100) / 100).replace('.', ',');
    const lines = inYr.map(d => { const r = fxOf(d); return [d.number, d.date, d.client?.name, effStatus(d), curOf(d), n(d.total), r == null ? '' : String(r).replace('.', ','), r == null ? '' : n(d.total * r)]; });
    const csv = '﻿' + [head, ...lines].map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `valuta-overzicht-${yr}.csv`; a.click();
  };
  bindCommon(m);
}

  document.querySelectorAll('.drop-ind').forEach(x => x.remove());
  const ind = document.createElement('div'); ind.className = 'drop-ind'; ind.style.position = 'fixed'; ind.style.display = 'none'; document.body.appendChild(ind);
  root.addEventListener('pointerdown', e => {

    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.blk');
    if (!under || under === drag.el || !root.contains(under)) { ind.style.display = 'none'; drag.target = null; return; }
    const r = under.getBoundingClientRect(), rx = (e.clientX - r.left) / r.width, ry = (e.clientY - r.top) / r.height;
    const side = drag.id !== 'items' && under.dataset.b !== 'items';
    const zone = side && rx < 0.25 ? 'left' : side && rx > 0.75 ? 'right' : ry < 0.5 ? 'before' : 'after';
    drag.target = under.dataset.b; drag.zone = zone;
    Object.assign(ind.style, { display: 'block' }, zone === 'left' || zone === 'right'

      : { left: r.left + 'px', top: (zone === 'before' ? r.top - 6 : r.bottom + 2) + 'px', width: r.width + 'px', height: '4px' });
  });
  const end = () => {
    if (!drag) return;
    ind.style.display = 'none'; drag.el.classList.remove('dragging');
    if (drag.target) { moveBlock(drag.id, drag.target, drag.zone); T.dirty = true; draw(); }
    drag = null;

}

    totals: () => `<div class="tots"><div><b>${L('sub')}</b><span>${M(t.subtotal)}</span></div>${t.discount ? `<div><span>${L('discount')}</span><span>−${M(t.discount)}</span></div>` : ''}<div><span>${L('vat')} (${vatTxt}%)</span><span>${M(t.vat_amount)}</span></div>
      <div class="g">${L(isQ ? 'total_q' : 'total_i')}<span>${M(t.total)}</span></div></div>`,
    closing: () => `<div class="closing">${isQ ? S('quote_closing') : (opt.edit ? S('invoice_closing', s.invoice_closing) : esc(termLines.join('\n')))}${isQ ? '' : `\n\n${L('greet')}`}</div>`,
    sign: () => `<div class="sign">
      <div class="who"><b>${esc(isQ ? s.quote_signer : s.invoice_signer)}</b>${esc(isQ ? s.quote_signer_role : s.invoice_signer_role)}</div>
      ${isQ && (s.quote_signer_phone || s.quote_signer_email) ? `<div class="ct">${s.quote_signer_phone ? `<div>${esc(s.quote_signer_phone)}</div>` : ''}${s.quote_signer_email ? `<div>${esc(s.quote_signer_email)}</div>` : ''}</div>` : ''}</div>`,
  };
  if (modern) Object.assign(R, {
    title: () => `<div class="m-dates"><div><div class="ml">${L(isQ ? 'm_qdate' : 'm_idate')}</div><b>${FD(d.date)}</b></div><div><div class="ml">${L(isQ ? 'm_valid' : 'm_due')}</div><b>${FD(d.due_date)}</b></div>${!isQ && d.reference ? `<div><div class="ml">${L('m_ref')}</div><b>${esc(d.reference)}</b></div>` : ''}</div>`,
    to: () => `<div class="m-box"><div class="ml">${L('to')}</div>${c.name ? `<div class="m-name">${esc(c.name)}</div>` : `<div style="color:#999">${s._lang === 'en' ? '[client]' : '[klant]'}</div>`}
      <div class="m-sub">${[c.vat_number ? `FIN: ${esc(c.vat_number)}` : '', c.contact ? `${L('attn')} ${esc(c.contact)}` : '', esc(c.address || ''), esc(c.postal_city || ''), esc(c.country || '')].filter(Boolean).join('<br>')}</div></div>`,
    from: () => `<div class="m-box"><div class="ml">${L('from')}</div><div class="m-name">${esc(s.company_name)}</div>
      <div class="m-sub">${[s.fin ? `FIN: ${esc(s.fin)}` : '', esc(s.address || ''), [s.postal_city, s.country].filter(Boolean).map(esc).join(', '), esc(s.phone || ''), isQ ? esc(s.email || '') : '', esc(s.website || ''),
        [s.kvk ? L('kvk') + ' ' + esc(s.kvk) : '', s.btw ? L('btwnr') + ' ' + esc(s.btw) : ''].filter(Boolean).join(' · ')].filter(Boolean).join('<br>')}</div></div>`,
    subject: () => `<div class="m-box"><div class="ml">${L('subject')}</div><div class="m-name">${esc(d.subject)}</div>${d.subject_detail ? `<div class="m-sub">${esc(d.subject_detail)}</div>` : ''}</div>`,
    items: () => `<table class="m-table"><thead><tr><th>${L('th_desc')}</th><th class="c" style="width:16mm">${L('th_qty')}</th><th class="r" style="width:32mm">${L('th_rate')}</th><th class="r" style="width:34mm">${L('th_amt')}</th></tr></thead>
      <tbody>${items.map(it => `<tr><td>${esc(it.desc)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</td><td class="c">${esc(String(it.qty))}</td><td class="r">${M(it.rate)}</td><td class="r">${M((Number(it.qty) || 0) * (Number(it.rate) || 0))}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:#999">—</td></tr>'}</tbody></table>`,
    totals: () => `<div class="m-tots"><div><span>${L('sub')}</span><span>${M(t.subtotal)}</span></div>${t.discount ? `<div><span>${L('discount')}</span><span>−${M(t.discount)}</span></div>` : ''}
      <div><span>${L('vat')} (${String(d.vat_rate)}%)</span><span>${M(t.vat_amount)}</span></div>
      <div class="g"><span>${L(isQ ? 'total_q' : 'total_i')}</span><span>${M(t.total)}</span></div></div>`,
    info: () => isQ
      ? `<div class="m-box"><div class="ml">${L('info_q')}</div><div class="m-sub" style="white-space:pre-line">${opt.edit ? S('quote_terms') : termLines.map(esc).join('<br>')}</div></div>`
      : `<div class="m-box"><div class="ml">${L('info_i')}</div><div class="m-pay">${payLines.length ? payLines.join('<br>') : [s.iban ? `<b>${L('iban')}</b> ${esc(s.iban)}` : '', s.bic ? `<b>${L('bic')}</b> ${esc(s.bic)}` : '', `<b>${L('tnv')}</b> ${esc(s.company_name)}`].filter(Boolean).join('<br>')}</div></div>`,
    closing: () => `<div class="m-closing">${isQ ? S('quote_closing') : (opt.edit ? S('invoice_closing', s.invoice_closing) : esc(termLines.join('\n')))}${!isQ && labels.greet ? `\n\n${L('greet')}` : ''}</div>`,
    sign: () => `<div class="m-sign"><b>${esc(isQ ? s.quote_signer : s.invoice_signer)}</b><span>${esc(isQ ? s.quote_signer_role : s.invoice_signer_role)}</span></div>`,
  });
  const block = b => `<div class="blk" data-b="${b}">${opt.edit ? `<span class="blk-h" data-drag="${b}">⠿ ${esc(BLOCKS[b])}</span>` : ''}${R[b]()}</div>`;
  // afsluiting + ondertekening onderaan de pagina: eerste rij met een van beide krijgt 'push'
  const pushAt = lay.pushDown ? lay.rows.findIndex(r => r.includes('closing') || r.includes('sign')) : -1;
  const rows = lay.rows.map((r, ri) => `<div class="rw ${ri === pushAt && ri > 0 ? 'push' : ''} ${r.length > 1 ? 'two' : ''} ${r.includes('totals') && r.length > 1 ? (r[0] === 'totals' ? 'tl' : 'tr') : ''}">${r.map(block).join('')}</div>`).join('');
  const wm = lay.watermark ? `<img class="wm${s.logo ? ' wm-custom' : ''}" src="${s.logo || '/watermark.png'}" alt="">` : '';
  if (modern) return `<div class="sheet modern${opt.edit ? ' editing' : ''}">
  <div class="m-top"></div>
  <div class="m-head"><div class="m-logo"><img src="${s.logo || '/logo.png'}" alt=""></div>
    <div class="m-ttl"><h1>${L(isQ ? 'title_offerte' : 'title_factuur')}</h1><div class="m-no">${esc(d.number)}</div>${isQ && s.tagline ? `<div class="m-tag">${S('tagline')}</div>` : ''}</div></div>
  <div class="m-rule"></div>
  <div class="sh-body">${wm}${rows}</div>
  <div class="m-foot"><div><i></i><span>${esc(s.company_name)}</span></div><span>${esc(d.number)}</span></div>
</div>`;
  return `<div class="sheet${opt.edit ? ' editing' : ''}">
  <div class="sh-head">
    ${logoHTML(s)}
    <svg class="sh-wave" viewBox="0 0 210 20" preserveAspectRatio="none">
      <path d="M0 20 L0 13 C 45 3, 110 12, 210 2 L210 20 Z" fill="#fff"/>
      <path d="M0 18 C 18 10, 40 6, 64 6 C 40 8, 18 13, 0 20 Z" fill="#f6b90b"/>
    </svg>
  </div>
  <div class="sh-body">
    ${wm}
    ${rows}
  </div>
  <div class="sh-foot"><img class="fmark" src="${s.logo || '/mark.png'}" alt=""><b>${esc(s.company_name)}</b><span class="sep">|</span>${S('footer_services')}</div>
</div>`;
}

// ================= afspraken (aanvragen via de landingspagina) =================
async function renderAppointments(m) {
  m.innerHTML = '<div class="top"><h1>Afspraken</h1></div><div class="card muted">Laden…</div>';
  let list;
  try { list = await api('appointments'); } catch (e) { m.innerHTML = `<div class="top"><h1>Afspraken</h1></div><div class="card empty">${esc(e.message)}</div>`; return; }
  const today = new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10);
  const canEdit = can('clients.write'), canDel = can('clients.delete');
  const upcoming = list.filter(a => a.date >= today && a.status !== 'geannuleerd'), past = list.filter(a => !(a.date >= today && a.status !== 'geannuleerd'));
  const cls = s => ({ aangevraagd: 'Open', bevestigd: 'Betaald', geannuleerd: 'Vervallen' })[s] || '';
  const row = a => `<tr>
    <td style="white-space:nowrap"><b>${fdate(a.date)}</b><br><span class="muted">${esc(a.time)}</span></td>
    <td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.subject || '')}</span>${a.message ? `<div style="font-size:12.5px;margin-top:4px;white-space:pre-line">${esc(a.message)}</div>` : ''}</td>
    <td><a href="mailto:${esc(a.email)}">${esc(a.email)}</a>${a.phone ? `<br><a href="tel:${esc(a.phone.replace(/[^+\d]/g, ''))}">${esc(a.phone)}</a>` : ''}</td>
    <td><span class="tag ${cls(a.status)}">${esc(a.status)}</span></td>
    <td class="num" style="white-space:nowrap">${canEdit ? [a.status !== 'bevestigd' ? `<button class="btn sm pri" data-ast="bevestigd" data-id="${a.id}">Bevestigen</button>` : '', a.status !== 'geannuleerd' ? `<button class="btn sm" data-ast="geannuleerd" data-id="${a.id}">Annuleren</button>` : ''].join(' ') : ''}${canDel ? ` <button class="btn sm danger" data-adel="${a.id}">✕</button>` : ''}</td></tr>`;
  const table = (arr, empty) => arr.length ? `<div class="tablewrap"><table><thead><tr><th>Moment</th><th>Bezoeker</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(row).join('')}</tbody></table></div>` : `<div class="muted" style="padding:6px 0">${empty}</div>`;
  m.innerHTML = `<div class="top"><h1>Afspraken</h1><a class="btn" href="/" target="_blank" rel="noopener">Landingspagina ↗</a></div>
    <div class="card"><h2>Aankomend (${upcoming.length})</h2>${table(upcoming, 'Geen aankomende afspraken.')}</div>
    ${past.length ? `<div class="card" style="margin-top:18px"><h2>Eerder / geannuleerd</h2>${table(past.slice().reverse(), '')}</div>` : ''}
    <p class="muted" style="font-size:12.5px">Aanvragen komen binnen als <b>aangevraagd</b> en houden het tijdstip bezet. Neem contact op met de bezoeker en klik op <b>Bevestigen</b>. Bij <b>Annuleren</b> komt het tijdstip weer vrij. Beschikbare dagen en tijden stel je in onder Instellingen.</p>`;
  m.querySelectorAll('[data-ast]').forEach(b => b.onclick = async () => { try { const r = await api('appointments', { method: 'POST', body: { id: b.dataset.id, status: b.dataset.ast } }); toast(r.mailed === true ? 'Bijgewerkt — bezoeker is per e-mail op de hoogte gebracht' : r.mailed === false ? 'Bijgewerkt, maar de e-mail kon niet verstuurd worden' : 'Bijgewerkt', r.mailed === false, 4500); renderAppointments(m); } catch (e) { toast(e.message, 1); } });
  m.querySelectorAll('[data-adel]').forEach(b => b.onclick = async () => { if (!confirm('Deze afspraak definitief verwijderen?')) return; try { await api('appointments/' + b.dataset.adel, { method: 'DELETE' }); renderAppointments(m); } catch (e) { toast(e.message, 1); } });
}

// ================= shared bindings =================
function bindCommon(m) {
  if ($('#goAppt')) $('#goAppt').onclick = () => go('afspraken');
  m.querySelectorAll('[data-open]').forEach(r => r.onclick = () => openDoc(r.dataset.open));
  m.querySelectorAll('[data-new]').forEach(b => b.onclick = () => newDoc(b.dataset.new));
}

// ---- rol-afhankelijke weergave (de server dwingt de rechten zelf af) ----
function applyRole() {
  const b = document.body.classList;
  b.toggle('ro-docs', !can('docs.write')); b.toggle('ro-del', !can('docs.delete'));
  b.toggle('ro-clients', !can('clients.write')); b.toggle('ro-catalog', !can('catalog.write'));
  b.toggle('ro-rates', !can('rates.write')); b.toggle('ro-settings', !can('settings.write'));
}
setInterval(() => fetch('/api/ping').then(r => { if (r.status === 401) location.href = '/login'; }).catch(() => {}), 120000);
$('#mHelp').onclick = () => go('handleiding');
$('#whoName').textContent = ME.name; $('#whoRole').textContent = ROLE_LABEL[ME.role] || ROLE_LABEL['alleen-lezen'];
$('#sideOut').onclick = doLogout;
applyRole();
loadAll().then(() => { setSideLogo(); $('#ver').textContent = $('#mVer').textContent = 'v' + APP_VERSION; render(); })
  .catch(e => { $('#main').innerHTML = `<div class="card empty">Kan de gegevens niet laden.<br><small>${esc(e.message)}</small></div>`; });
</script>
